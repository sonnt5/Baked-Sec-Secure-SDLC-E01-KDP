[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "coding-war-backend"
version = "1.0.0"
description = "Backend API for Coding War - Online Judge Platform"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & Settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.2.0",
    "passlib[bcrypt]>=1.7.4",
    # Task Queue
    "celery[redis]>=5.4.0",
    # WebSocket
    "python-socketio>=5.11.0",
    # AWS S3
    "boto3>=1.35.0",
    # Redis
    "redis>=5.2.0",
    # Docker SDK (for judge sandbox)
    "docker>=7.0.0",
    # Rate Limiting
    "slowapi>=0.1.9",
    # Logging
    "structlog>=24.4.0",
    # Email
    "aiosmtplib>=3.0.0",
    # Security
    "python-multipart>=0.0.18",
    "email-validator>=2.2.0",
    # CORS & Compression (built-in via Starlette)
    # File handling
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
